# Quick test configuration (minimal epochs for validation)
seed: 42
device: auto

dataset:
  gt_dir: train
  noisy_lr_dir: NoisyLR
  split_dir: splits

model:
  name: noise_aware_nafnet
  in_channels: 1
  out_channels: 1
  width: 16
  num_blocks: [1, 1, 2, 2]
  dropout_rate: 0.0
  noise_conditioning:
    mode: spatial

degradation:
  blur:
    enabled: true
    sigma_min: 0.7
    sigma_max: 1.3
  downsample:
    scale: 2
    method: gaussian_prefilter
  noise:
    signal_dependent:
      enabled: true
      scale_min: 0.3
      scale_max: 2.0
    additive:
      enabled: true
      sigma_min: 0.002
      sigma_max: 0.05
    multiplicative:
      enabled: true
      alpha_min: 0.02
      alpha_max: 0.12
    heavy_tail:
      enabled: false
    mix_weights:
      signal_dependent: 0.5
      additive: 0.3
      multiplicative: 0.2

loss:
  charbonnier:
    weight: 1.0
    epsilon: 1.0e-6
  ssim:
    weight: 0.1
  gradient:
    weight: 0.0
  frequency:
    weight: 0.0

training:
  batch_size: 4
  patch_size_gt: 128
  patch_size_lr: 64
  epochs: 3
  optimizer:
    type: AdamW
    lr: 0.001
    weight_decay: 0.0001
    betas: [0.9, 0.999]
  scheduler:
    type: cosine
    warmup_epochs: 1
    min_lr: 1.0e-6
  mixed_precision: false
  num_workers: 0
  pin_memory: false
  early_stopping:
    enabled: false

validation:
  interval: 2
  batch_size: 2

augmentation:
  horizontal_flip: true
  vertical_flip: true
  rotation_90: true
  random_crop: true

checkpointing:
  save_dir: experiments/test_quick
  save_best: true
  save_last: true
  metrics: [psnr, ssim]

inference:
  batch_size: 4
  tta:
    enabled: false
